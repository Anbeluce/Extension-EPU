<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Cookie Editor</title>
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; margin: 16px; color: #1f2937; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    p.hint { color: #6b7280; margin: 0 0 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 4px 6px; text-align: left; vertical-align: middle; }
    input[type="text"] { width: 100%; box-sizing: border-box; font: inherit; padding: 2px 4px; }
    input[type="text"][data-field="value"] { font-family: ui-monospace, monospace; }
    .flags label { margin-right: 6px; white-space: nowrap; }
    button { padding: 4px 8px; border: 0; border-radius: 6px; cursor: pointer; }
    button.save { background: #2563eb; color: #fff; }
    button.delete { background: #fee2e2; color: #b91c1c; }
    button.add, button.refresh { background: #eff6ff; color: #1d4ed8; margin-right: 6px; }
    #toolbar { margin-bottom: 10px; }
    #msg { margin-left: 8px; color: #047857; }
    #msg.error { color: #b91c1c; }
    tr.new-row td { background: #f0fdf4; }
  </style>
</head>
<body>
  <h1>Cookie Editor</h1>
  <p class="hint">Xem, sửa, xoá, thêm cookie cho <code id="domain-label"></code> (kể cả cookie HttpOnly). Chỉ dùng cho tài khoản của bạn.</p>
  <div id="toolbar">
    <button class="refresh" id="btn-refresh">Tải lại</button>
    <button class="add" id="btn-add">+ Thêm cookie</button>
    <span id="msg"></span>
  </div>
  <table>
    <thead>
      <tr>
        <th style="width:22%">Tên</th>
        <th style="width:32%">Giá trị</th>
        <th style="width:14%">Path</th>
        <th style="width:16%">Hết hạn</th>
        <th style="width:10%">Cờ</th>
        <th style="width:6%"></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <script src="../config.js"></script>
  <script src="cookie-editor.js"></script>
</body>
</html>
