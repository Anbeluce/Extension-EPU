<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Tra cứu giảng viên — EPU Extension</title>
  <link rel="stylesheet" href="teachers.css">
</head>
<body>
  <header>
    <h1>Tra cứu giảng viên</h1>
    <div class="header-actions">
      <button id="btn-refresh" class="btn-header">Tải lại dữ liệu</button>
      <button id="btn-settings" class="btn-header">Cài đặt</button>
    </div>
  </header>

  <div class="container">
    <div class="left-panel">
      <div class="filters">
        <input type="text" id="teacher-search" placeholder="Tìm theo tên, mã GV..." autofocus>
        <select id="filter-dept"><option value="">Tất cả khoa</option></select>
      </div>
      <div id="teacher-grid"></div>
      <div id="pagination" class="pagination"></div>
      <p id="status" class="status"></p>
    </div>
    <div class="right-panel" id="teacher-detail">
      <div class="detail-empty">Chọn giảng viên để xem chi tiết</div>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="../shared/dom.js"></script>
  <script src="../shared/teachers.js"></script>
  <script src="teachers.js"></script>
</body>
</html>
